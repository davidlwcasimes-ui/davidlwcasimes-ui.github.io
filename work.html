<section class="hero" style="border-top:0">
  <h1>Selected visual work</h1>
  <p class="lede">Photographs and graphics from 2026. Select any image to view it larger.</p>
</section>

<section aria-labelledby="p-h">
  <div class="sec-head"><h2 id="p-h">Photography</h2></div>
  <div class="gallery">
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p01-capitol-steps-boy.jpg" alt="Rep. Mast laughing beside a young constituent in an orange hoodie on the Capitol steps, background softly blurred" loading="lazy"></button>
      <figcaption><b>Capitol Steps</b><span>Capitol steps · May 2026</span><p>Shallow depth of field, an unposed laugh and one shot of orange against the marble. It makes a routine constituent visit look like a magazine portrait.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p04-flood-response.jpg" alt="Sheriff's high-water vehicle on a flooded residential street, a deputy pointing down the road" loading="lazy"></button>
      <figcaption><b>Flood Response</b><span>District · Nov 2026</span><p>A news photograph rather than a photo op: the deputy's gesture, the water line and the rescue truck tell the story in one frame.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p02-vessel-blue-sky.jpg" alt="Man in a cap seen from behind, facing a gray military vessel under a bright blue sky with clouds" loading="lazy"></button>
      <figcaption><b>The Vessel</b><span>District</span><p>Shot from behind the subject, so the viewer stands where he stands. Strong color and a clean horizon.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p11-district-candid.jpg" alt="Rep. Mast in profile in a crowd at an evening district event, a man in a cowboy hat behind him" loading="lazy"></button>
      <figcaption><b>In the Room</b><span>District</span><p>A profile pulled out of a crowd, with layered faces in the background giving it depth.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p07-facetime-candid.jpg" alt="Rep. Mast grinning and holding up a phone on a video call in his Capitol office" loading="lazy"></button>
      <figcaption><b>On the Call</b><span>Capitol office · Oct 2026</span><p>A personality shot. The clock and door frame the subject, and the moment is entirely unposed.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p03-students-capitol-steps.jpg" alt="Rep. Mast addressing a large group of students in bright blue and green shirts on the Capitol steps" loading="lazy"></button>
      <figcaption><b>Student Visit</b><span>Capitol steps</span><p>A diagonal composition that turns a group photo into a scene, with the speaker small against the crowd.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p13-students-on-steps-wide.jpg" alt="Wide shot of elementary students in teal shirts on the Capitol steps under the dome" loading="lazy"></button>
      <figcaption><b>Under the Dome</b><span>Cypress Trails Elementary · Apr 2026</span><p>A low angle puts the dome, the flag and the class in one frame. A natural establishing shot for a recap.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p10-hearing-room-portrait.jpg" alt="Rep. Mast in a committee hearing room, looking off frame, flags behind him" loading="lazy"></button>
      <figcaption><b>Hearing Room</b><span>EOD Day on the Hill · Jul 2026</span><p>A quiet, off-camera look in a formal room. It reads as a considered portrait, not a grab shot.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p14-sheriff-briefing.jpg" alt="Rep. Mast talking with a county sheriff outdoors during a district visit" loading="lazy"></button>
      <figcaption><b>Sheriff's Briefing</b><span>District · Nov 2026</span><p>Mid-conversation, hands in motion. Captures the working side of a district visit.</p></figcaption>
    </figure>
    <figure class="wide photo">
      <button class="shot" type="button"><img src="img/work/p12-capitol-dome.jpg" alt="The Capitol dome against a deep blue sky with scattered clouds" loading="lazy"></button>
      <figcaption><b>The Dome</b><span>Apr 2026</span><p>A clean, well-exposed shot taken for the office's own image library and used under many graphics.</p></figcaption>
    </figure>
  </div>
</section>

<section aria-labelledby="g-h">
  <div class="sec-head"><h2 id="g-h">Graphics</h2></div>
  <div class="gallery">
    <figure>
      <button class="shot" type="button"><img src="img/work/g01-mission-continues.jpg" alt="Silhouette of Rep. Mast from behind under the headline Mission Continues, with a list of veterans legislation set like film credits" loading="lazy"></button>
      <figcaption><b>Mission Continues</b><span>Veterans · Oct 2026</span><p>One backlit silhouette carries the whole message. The legislative record is set like closing credits, so a dense list of bills reads as an epilogue.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g03-service-academy-poster.jpg" alt="Illustrated retro recruiting poster: We're looking for the best, attend a U.S. Service Academy physical fitness assessment day, Sat. Nov. 14, 8 AM" loading="lazy"></button>
      <figcaption><b>We're Looking for the Best</b><span>Service academies · Oct 2026</span><p>A recruiting-poster illustration where the office usually runs a stock photo. It still fits the venue, date, time and every branch's seal without crowding.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g02-medal-of-sacrifice.jpg" alt="Close-up of hands holding the Medal of Sacrifice in its case, caption Recognize the Debt" loading="lazy"></button>
      <figcaption><b>Medal of Sacrifice</b><span>May 2026</span><p>A product shot treated with real restraint: tight crop, rich blue ribbon, widely spaced gold caption.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g06-mfn-529b.jpg" alt="Navy graphic with a large gold $529B: projected domestic savings from most-favored-nation drug pricing" loading="lazy"></button>
      <figcaption><b>$529B: Most-Favored-Nation Pricing</b><span>May 2026</span><p>One number, one sentence of context, a footnote. Clear editorial hierarchy, entirely on the office palette.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g08-tax-fact-sheet.jpg" alt="Fact sheet: average tax refund by county, with a map highlighting St. Lucie, Martin and Palm Beach and the national average" loading="lazy"></button>
      <figcaption><b>Average Refund by County</b><span>Tax day · Apr 2026</span><p>Ties a national number to the three district counties on a map. Gives the reader a figure for their own county, with a link to act on it.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g09-rx-prices.jpg" alt="Bar chart on textured paper showing change in prescription drug prices by presidential term" loading="lazy"></button>
      <figcaption><b>Prescription Drug Prices</b><span>Jun 2026</span><p>A real chart with a source line, given a newsprint texture so it reads as evidence rather than an ad.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g07-small-business.jpg" alt="Small Business Week graphic: the permanent standard deduction and Florida's small businesses, four statistics" loading="lazy"></button>
      <figcaption><b>Small Business Week</b><span>May 2026</span><p>Four statistics on a consistent grid, each with a unit and a one-line explanation. Clean information design.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g05-clean-water-economy.jpg" alt="Aerial photo of a boat on green water with the headline Clean water is our economy: 84,000 businesses, $223.5B generated every year" loading="lazy"></button>
      <figcaption><b>Clean Water Is Our Economy</b><span>Jul 2026</span><p>The aerial wake leads the eye to the headline, and the two figures turn an environmental issue into an economic one.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g10-memorial.jpg" alt="Black memorial graphic, One Year Ago Today, listing three names and ages, We owe their families action" loading="lazy"></button>
      <figcaption><b>One Year Ago Today</b><span>Aug 2026</span><p>Three names in serif on black, with no imagery and no flourish. Leaving things out is the design decision.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g11-earth-day.jpg" alt="Underwater photo of a manatee with the headline Protect the Treasure Coast, Earth Day April 22, 2026" loading="lazy"></button>
      <figcaption><b>Protect the Treasure Coast</b><span>Apr 2026</span><p>A local subject makes a generic observance specific to the district, with headline type that sits on the water.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g12-patriots-day.jpg" alt="Patriots' Day graphic over a faded engraving of the battle at Lexington, The shot heard round the world, April 19, 1775" loading="lazy"></button>
      <figcaption><b>Patriots' Day</b><span>Apr 2026</span><p>A period engraving fades into the dark base, and the italic display face matches the era.</p></figcaption>
    </figure>
    <figure>
      <button class="shot" type="button"><img src="img/work/g15-ve-day.jpg" alt="VE Day, May 8, 1945, over a monochrome archival photo of a sailor reading the newspaper headline" loading="lazy"></button>
      <figcaption><b>VE Day</b><span>May 2026</span><p>Archival photo, a duotone treatment and wide-set type. The newspaper headline in the photo does half the work.</p></figcaption>
    </figure>
    <figure class="wide">
      <button class="shot" type="button"><img src="img/work/g04-bridge-funded.jpg" alt="FUNDED: $78.9 million for a new St. Lucie River railroad bridge, over a photo of the existing bridge" loading="lazy"></button>
      <figcaption><b>FUNDED: St. Lucie River Bridge</b><span>Aug 2026</span><p>One word does the announcing. The dollar figure and project sit underneath for anyone who stops scrolling.</p></figcaption>
    </figure>
    <figure class="wide">
      <button class="shot" type="button"><img src="img/work/g14-causeway-closures.jpg" alt="Boater advisory for North Causeway bridge closures in Fort Pierce, three date columns with closed, restricted and normal status" loading="lazy"></button>
      <figcaption><b>North Causeway Bridge Closures</b><span>Fort Pierce · Jul 2026</span><p>A public-service notice built like a transit sign: three date columns, a status label on each, readable at a glance.</p></figcaption>
    </figure>
    <figure class="wide">
      <button class="shot" type="button"><img src="img/work/g13-hurricane-season.jpg" alt="Hurricane Season June 1 to November 30 banner listing the 2026 storm names in three columns" loading="lazy"></button>
      <figcaption><b>Hurricane Season</b><span>Jun 2026</span><p>The season's storm-name list as a reference graphic, the kind people screenshot and save.</p></figcaption>
    </figure>
  </div>
</section>
